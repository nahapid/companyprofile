<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#07111F"/>
  <!-- Grid -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="100" y1="0" x2="100" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="500" y1="0" x2="500" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="600" stroke="#1E293B" stroke-width="0.5"/>
  <!-- Internet -->
  <rect x="340" y="40" width="120" height="40" rx="4" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="400" y="65" text-anchor="middle" fill="#0EA5E9" font-family="monospace" font-size="12">INTERNET</text>
  <!-- Firewall -->
  <rect x="340" y="130" width="120" height="40" rx="4" stroke="#22D3EE" stroke-width="1.5" fill="none"/>
  <text x="400" y="155" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="11">FIREWALL</text>
  <line x1="400" y1="80" x2="400" y2="130" stroke="#0EA5E9" stroke-width="1"/>
  <!-- Core -->
  <rect x="340" y="220" width="120" height="40" rx="4" stroke="#0EA5E9" stroke-width="1.5" fill="none"/>
  <text x="400" y="245" text-anchor="middle" fill="#0EA5E9" font-family="monospace" font-size="11">CORE SWITCH</text>
  <line x1="400" y1="170" x2="400" y2="220" stroke="#22D3EE" stroke-width="1"/>
  <!-- Branch left -->
  <rect x="100" y="330" width="120" height="40" rx="4" stroke="#94A3B8" stroke-width="1" fill="none"/>
  <text x="160" y="355" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">CAMPUS LAN</text>
  <line x1="400" y1="260" x2="160" y2="330" stroke="#0EA5E9" stroke-width="0.8"/>
  <!-- Branch center -->
  <rect x="340" y="330" width="120" height="40" rx="4" stroke="#94A3B8" stroke-width="1" fill="none"/>
  <text x="400" y="355" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">DATA CENTER</text>
  <line x1="400" y1="260" x2="400" y2="330" stroke="#0EA5E9" stroke-width="0.8"/>
  <!-- Branch right -->
  <rect x="580" y="330" width="120" height="40" rx="4" stroke="#94A3B8" stroke-width="1" fill="none"/>
  <text x="640" y="355" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">REMOTE SITE</text>
  <line x1="400" y1="260" x2="640" y2="330" stroke="#0EA5E9" stroke-width="0.8"/>
  <!-- Endpoint nodes -->
  <circle cx="120" cy="430" r="6" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="160" cy="430" r="6" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="200" cy="430" r="6" fill="#0EA5E9" opacity="0.5"/>
  <line x1="160" y1="370" x2="120" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="160" y1="370" x2="160" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="160" y1="370" x2="200" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <circle cx="360" cy="430" r="6" fill="#22D3EE" opacity="0.5"/>
  <circle cx="400" cy="430" r="6" fill="#22D3EE" opacity="0.5"/>
  <circle cx="440" cy="430" r="6" fill="#22D3EE" opacity="0.5"/>
  <line x1="400" y1="370" x2="360" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="400" y1="370" x2="400" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="400" y1="370" x2="440" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <circle cx="600" cy="430" r="6" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="640" cy="430" r="6" fill="#0EA5E9" opacity="0.5"/>
  <circle cx="680" cy="430" r="6" fill="#0EA5E9" opacity="0.5"/>
  <line x1="640" y1="370" x2="600" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="640" y1="370" x2="640" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="640" y1="370" x2="680" y2="424" stroke="#1E293B" stroke-width="0.5"/>
  <!-- Labels -->
  <text x="400" y="540" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">ENTERPRISE NETWORK TOPOLOGY</text>
</svg>
