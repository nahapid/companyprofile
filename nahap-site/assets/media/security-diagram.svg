<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#07111F"/>
  <!-- Grid -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#1E293B" stroke-width="0.5"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#1E293B" stroke-width="0.5"/>
  <!-- Shield -->
  <path d="M400 80 L500 130 L500 280 Q500 380 400 430 Q300 380 300 280 L300 130 Z" stroke="#0EA5E9" stroke-width="2" fill="none"/>
  <!-- Lock icon inside shield -->
  <rect x="370" y="200" width="60" height="50" rx="6" stroke="#22D3EE" stroke-width="1.5" fill="none"/>
  <path d="M380 200 L380 180 Q380 160 400 160 Q420 160 420 180 L420 200" stroke="#22D3EE" stroke-width="1.5" fill="none"/>
  <circle cx="400" cy="225" r="6" fill="#0EA5E9"/>
  <!-- Security zones -->
  <rect x="80" y="330" width="140" height="60" rx="4" stroke="#0EA5E9" stroke-width="1" fill="none"/>
  <text x="150" y="355" text-anchor="middle" fill="#0EA5E9" font-family="monospace" font-size="10">ZONE: SERVER</text>
  <text x="150" y="375" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">VLAN 10</text>
  <rect x="260" y="330" width="140" height="60" rx="4" stroke="#22D3EE" stroke-width="1" fill="none"/>
  <text x="330" y="355" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10">ZONE: USER</text>
  <text x="330" y="375" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">VLAN 20</text>
  <rect x="440" y="330" width="140" height="60" rx="4" stroke="#0EA5E9" stroke-width="1" fill="none"/>
  <text x="510" y="355" text-anchor="middle" fill="#0EA5E9" font-family="monospace" font-size="10">ZONE: IOT</text>
  <text x="510" y="375" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">VLAN 30</text>
  <rect x="620" y="330" width="140" height="60" rx="4" stroke="#22D3EE" stroke-width="1" fill="none"/>
  <text x="690" y="355" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="10">ZONE: GUEST</text>
  <text x="690" y="375" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">VLAN 40</text>
  <!-- Connection lines from shield to zones -->
  <line x1="400" y1="430" x2="150" y2="330" stroke="#0EA5E9" stroke-width="0.8" opacity="0.6"/>
  <line x1="400" y1="430" x2="330" y2="330" stroke="#22D3EE" stroke-width="0.8" opacity="0.6"/>
  <line x1="400" y1="430" x2="510" y2="330" stroke="#0EA5E9" stroke-width="0.8" opacity="0.6"/>
  <line x1="400" y1="430" x2="690" y2="330" stroke="#22D3EE" stroke-width="0.8" opacity="0.6"/>
  <!-- Endpoint dots -->
  <circle cx="110" cy="430" r="4" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="140" cy="440" r="4" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="170" cy="430" r="4" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="290" cy="430" r="4" fill="#22D3EE" opacity="0.4"/>
  <circle cx="320" cy="440" r="4" fill="#22D3EE" opacity="0.4"/>
  <circle cx="350" cy="430" r="4" fill="#22D3EE" opacity="0.4"/>
  <circle cx="470" cy="430" r="4" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="500" cy="440" r="4" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="530" cy="430" r="4" fill="#0EA5E9" opacity="0.4"/>
  <circle cx="650" cy="430" r="4" fill="#22D3EE" opacity="0.4"/>
  <circle cx="680" cy="440" r="4" fill="#22D3EE" opacity="0.4"/>
  <circle cx="710" cy="430" r="4" fill="#22D3EE" opacity="0.4"/>
  <!-- Label -->
  <text x="400" y="540" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="11">SECURITY SEGMENTATION ARCHITECTURE</text>
</svg>
