{{ define "main" }}
<div class="bg-slate-50 dark:bg-slate-900 min-h-screen pt-24 pb-16">
  <div class="container mx-auto px-4 max-w-4xl">
    
    <a href="/insights/" class="inline-flex items-center text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-medium mb-8 transition-colors">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Back to Insights
    </a>

    <article class="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden">
      
      <!-- Article Header -->
      <header class="p-8 md:p-12 border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50">
        <div class="flex flex-wrap gap-2 mb-6">
          {{ if .Params.categories }}
            {{ range .Params.categories }}
            <span class="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-3 py-1 rounded-full text-xs font-bold">{{ . }}</span>
            {{ end }}
          {{ else }}
            <span class="bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-3 py-1 rounded-full text-xs font-bold">Case Study</span>
          {{ end }}
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 dark:text-white mb-6 leading-tight">
          {{ .Title }}
        </h1>
        <div class="text-slate-500 dark:text-slate-400 font-medium text-sm flex items-center gap-4">
          <span>{{ .Date.Format "Jan 02, 2006" }}</span>
          <span>&middot;</span>
          <span>{{ .ReadingTime }} min read</span>
        </div>
      </header>

      <!-- Article Content -->
      <div class="p-8 md:p-12 prose prose-slate prose-lg max-w-none dark:prose-invert 
                  prose-headings:text-slate-900 dark:prose-headings:text-white 
                  prose-p:text-slate-700 dark:prose-p:text-slate-300
                  prose-a:text-blue-600 dark:prose-a:text-blue-400
                  prose-strong:text-slate-900 dark:prose-strong:text-white
                  prose-ul:text-slate-700 dark:prose-ul:text-slate-300
                  prose-ol:text-slate-700 dark:prose-ol:text-slate-300
                  prose-li:text-slate-700 dark:prose-li:text-slate-300
                  prose-blockquote:border-blue-500 prose-blockquote:text-slate-600 dark:prose-blockquote:text-slate-400">
        {{ .Content }}
      </div>
      
    </article>
  </div>
</div>

<!-- Add polyfills specifically for prose typography if Tailwind Typography plugin isn't rendering them -->
<style>
  /* Prose Polyfills for Dark Mode */
  html.dark .prose h1, html.dark .prose h2, html.dark .prose h3, html.dark .prose h4, html.dark .prose strong {
    color: #ffffff !important;
  }
  html.dark .prose p, html.dark .prose li, html.dark .prose ul, html.dark .prose ol {
    color: #cbd5e1 !important; /* text-slate-300 */
  }
  html.dark .prose a {
    color: #60a5fa !important; /* text-blue-400 */
  }
  html.dark .prose blockquote {
    color: #94a3b8 !important; /* text-slate-400 */
    border-left-color: #3b82f6 !important;
  }
  html.dark .prose code {
    color: #f8fafc !important;
    background-color: #1e293b !important;
  }
  
  /* Prose Polyfills for Light Mode */
  html:not(.dark) .prose h1, html:not(.dark) .prose h2, html:not(.dark) .prose h3, html:not(.dark) .prose h4, html:not(.dark) .prose strong {
    color: #0f172a !important; /* text-slate-900 */
  }
  html:not(.dark) .prose p, html:not(.dark) .prose li, html:not(.dark) .prose ul, html:not(.dark) .prose ol {
    color: #334155 !important; /* text-slate-700 */
  }
</style>
{{ end }}
